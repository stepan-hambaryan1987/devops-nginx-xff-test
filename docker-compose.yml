version: "3.3"

services:
  backend:
    build: ./backend
    container_name: backend
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  nginx1:
    image: nginx:1.25-alpine
    container_name: nginx1
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./nginx1/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  nginx2:
    image: nginx:1.25-alpine
    container_name: nginx2
    restart: unless-stopped
    ports:
      - "8082:8082"
    volumes:
      - ./nginx2/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 3    

  nginx3:
    image: nginx:1.25-alpine
    container_name: nginx3
    restart: unless-stopped
    ports:
      - "8083:8083"
    volumes:
      - ./nginx3/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8083/health"]
      interval: 10s
      timeout: 3s
      retries: 3     

networks:
  app-network:
    driver: bridge






