events {
    worker_connections 1024;
}

http {
    upstream nginx3_service {
        server nginx3:8083;
    }

    server {
        listen 8082;

        location / {
            proxy_pass http://nginx3_service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /health {
            access_log off;
            return 200 "OK";
        }
    }
}